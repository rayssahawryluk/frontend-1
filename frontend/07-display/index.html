<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Display: bloco embutido -->
    <div class="inline-block">a</div>
    <div class="inline-block">b</div>
    <div class="inline-block">c</div>

    <!-- Posição sticky -->
    <div class="sticky">
        <span>Sou um elemento</span>
    </div>

    <!-- Display: bloco de exibição -->
    <div class="block">e</div>
    <div class="block">f</div>
    <div class="block">e</div>
    <div class="block">f</div>
    <div class="block">e</div>
    <div class="block">f</div>
    <div class="block">e</div>
    <div class="block">f</div>

    <!-- Escondendo um elemento -->
    <p class="escondendo">Esse parágrafo deve se esconder</p>

    <!-- Posição Estática -->
    <div class="static">
        <span>Sou um elemento estático</span>
    </div>

    <!-- Posição relativa -->
    <div class="relative">
        <span>Sou um elemento relativo</span>
    </div>

    <!-- Posição absoluta -->
    <div class="absolut">
        <span>Sou um elemento absoluto</span>
    </div>

    <!-- Posição Relativa com Absoluta -->
    <div class="bloco-relativo">
        <div class="bloco-absoluto1"></div>
        <div class="bloco-absoluto2"></div>
    </div>

    <!-- Z-Index -->
    <div class="bloco-relativo">
        <div class="bloco-absoluto3"></div>
        <div class="bloco-absoluto4"></div>
        <div class="bloco-absoluto5"></div>
    </div>


</body>
</html>
